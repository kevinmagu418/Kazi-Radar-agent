<svg width="720" height="720" viewBox="0 0 720 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 360) rotate(90) scale(260)">
      <stop stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGradient" x1="162" y1="162" x2="558" y2="558" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.52" stop-color="#06B6D4"/>
